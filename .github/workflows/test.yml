name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: go.sum
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test with race detector
        run: go test -race ./...
      - name: verify modules
        run: go mod verify
      - name: check tidy module files
        run: go mod tidy -diff
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...

  acceptance:
    name: acceptance (Terraform ${{ matrix.terraform_version }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        terraform_version:
          - "1.11.4"
          - "1.17.2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: go.sum
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "${{ matrix.terraform_version }}"
          terraform_wrapper: false
      - name: acceptance tests
        env:
          TF_ACC: "1"
          TF_ACC_TERRAFORM_PATH: terraform
        run: go test ./internal/provider -run TestAcc -v -count=1
